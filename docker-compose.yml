services:
  mysql:
    image: mysql:5.7
    container_name: litemall-mysql
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: litemall123456
      MYSQL_DATABASE: litemall
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
    volumes:
      - mysql_data:/var/lib/mysql
      - ./db/init-sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        - CMD-SHELL
        - mysql -h 127.0.0.1 -uroot -plitemall123456 -e "SELECT 1 FROM litemall.litemall_goods LIMIT 1" >/dev/null 2>&1
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped
    networks:
      - litemall-net

  litemall:
    image: eclipse-temurin:8-jre-alpine
    container_name: litemall-app
    ports:
      - "8080:8080"
    volumes:
      - ./litemall/litemall-all.jar:/app/litemall.jar:ro
      - litemall_storage:/storage
      - litemall_logs:/logs
    environment:
      TZ: Asia/Shanghai
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/litemall?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: litemall
      SPRING_DATASOURCE_PASSWORD: litemall123456
      SPRING_DATASOURCE_DRUID_URL: jdbc:mysql://mysql:3306/litemall?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_DRUID_USERNAME: litemall
      SPRING_DATASOURCE_DRUID_PASSWORD: litemall123456
    command: java -Dfile.encoding=UTF-8 -jar /app/litemall.jar
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - litemall-net

  sonarqube:
    image: sonarqube:lts-community
    container_name: sonarqube
    ports:
      - "9000:9000"
    environment:
      SONAR_ES_BOOTSTRAP_CHECKS_DISABLE: "true"
      SONAR_WEB_JAVAOPTS: -Xmx512m
      SONAR_CE_JAVAOPTS: -Xmx512m
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs
    restart: unless-stopped
    networks:
      - litemall-net

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --web.enable-lifecycle
    restart: unless-stopped
    networks:
      - litemall-net

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
    restart: unless-stopped
    networks:
      - litemall-net

volumes:
  mysql_data:
  litemall_storage:
  litemall_logs:
  sonarqube_data:
  sonarqube_extensions:
  sonarqube_logs:
  grafana_data:

networks:
  litemall-net:
    driver: bridge
