global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets:
          - prometheus:9090

  # litemall must expose /actuator/prometheus before this target becomes healthy.
  - job_name: litemall
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - litemall:8080
